# Optional GPS traces replication with osmrep. make up OSMREP=1
# osmrep runs `gpx replicate` every OSMREP_INTERVAL seconds against the db,
# nginx serves the files on http://127.0.0.1:8081/gpx/ like planet.osm.org/replication/.
services:
  osmrep:
    container_name: ${DOCKER_NAME_PREFIX:-osmdev}-osmrep
    image: ${DOCKER_NAME_PREFIX:-osmdev}-osmrep
    build:
      context: .
      dockerfile: docker/osmrep.Dockerfile
    command: /docker/osmrep-loop.sh
    environment:
      OSMREP_DATABASE: postgres://postgres:openstreetmap@db:5432/openstreetmap
      OSMREP_DATA_DIR: /data
      OSMREP_CONFIG: /etc/osmrep.yaml
      OSMREP_INTERVAL: ${OSMREP_INTERVAL:-60}
    volumes:
      - ${OSMREP_REPO:-../osmrep}:/osmrep
      - osmrep-bundle:/usr/local/bundle
      - replication-data:/data
      - ./docker:/docker:ro
      - ./config/osmrep.yaml:/etc/osmrep.yaml:ro
    depends_on:
      - db
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  replication:
    container_name: ${DOCKER_NAME_PREFIX:-osmdev}-replication
    image: nginx:alpine
    ports:
      - "127.0.0.1:${REPLICATION_PORT:-8081}:80"
    volumes:
      - replication-data:/usr/share/nginx/html:ro
      - ./config/replication-nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  osmrep-bundle:
  replication-data:
