# Optional pgAdmin on http://127.0.0.1:5050 (admin@osm.org / admin). make up PGADMIN=1
services:
  pgadmin:
    container_name: ${DOCKER_NAME_PREFIX:-osmdev}-pgadmin
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@osm.org
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./config/pgadmin-servers.json:/pgadmin4/servers.json:ro
      - ./config/pgpass:/pgpass:ro
    depends_on:
      - db

volumes:
  pgadmin-data:
