# Optional GPS traces dump with planet-dump-ng. make up PLANETDUMP=1, then make planet-dump PLANETDUMP=1
# planet-dump-ng is built into the image from GitHub; PLANET_DUMP_NG_REF in .env picks the branch or commit.
# nginx serves the files on http://127.0.0.1:8081/gps/, like planet.osm.org.
services:
  planetdump:
    container_name: ${DOCKER_NAME_PREFIX:-osmdev}-planetdump
    image: ${DOCKER_NAME_PREFIX:-osmdev}-planetdump
    build:
      context: .
      dockerfile: docker/planet-dump-ng.Dockerfile
      args:
        PLANET_DUMP_NG_REPO_URL: ${PLANET_DUMP_NG_REPO_URL:-https://github.com/Rub21/planet-dump-ng.git}
        PLANET_DUMP_NG_REF: ${PLANET_DUMP_NG_REF:-gpx-dump}
    command: sleep infinity
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: openstreetmap
    volumes:
      - planet-data:/data
      - ./docker:/docker:ro
    depends_on:
      - db

  planet:
    container_name: ${DOCKER_NAME_PREFIX:-osmdev}-planet
    image: nginx:alpine
    ports:
      - "127.0.0.1:${PLANET_PORT:-8081}:80"
    volumes:
      - planet-data:/data:ro
      - ./config/planet-nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  planet-data:
