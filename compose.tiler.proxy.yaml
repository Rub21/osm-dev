# Server: Martin on https://tiles-<slug>.<BASE_DOMAIN> through Traefik.
# Loaded by bin/deploy.sh together with compose.tiler.yaml when TILER=1.
services:
  tiler-martin:
    ports: !reset []
    networks:
      - default
      - osm-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=osm-proxy
      - traefik.http.routers.${DOCKER_NAME_PREFIX:-osmdev}-tiles.rule=Host(`${TILES_DOMAIN_NAME}`)
      - traefik.http.routers.${DOCKER_NAME_PREFIX:-osmdev}-tiles.entrypoints=websecure
      - traefik.http.routers.${DOCKER_NAME_PREFIX:-osmdev}-tiles.tls.certresolver=le
      - traefik.http.services.${DOCKER_NAME_PREFIX:-osmdev}-tiles.loadbalancer.server.port=3000

networks:
  osm-proxy:
    external: true
