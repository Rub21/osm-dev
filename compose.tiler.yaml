# Optional consumer side, the future gps-tiles: a PostGIS database filled from a
# traces replication feed with osmrep, and Martin serving it as vector tiles with its
# viewer on http://127.0.0.1:3100/. make up TILER=1
# By default it follows the feed of this instance (make up OSMREP=1 TILER=1). Set
# TILER_FEED_URL and TILER_DUMP_URL in .env to follow another feed, for example the
# one on the server.
services:
  tiler-db:
    container_name: ${DOCKER_NAME_PREFIX:-osmdev}-tiler-db
    image: postgis/postgis:17-3.5
    platform: linux/amd64  # postgis has no arm64 build
    environment:
      POSTGRES_DB: gpstiles
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: openstreetmap
    volumes:
      - tiler-db-data:/var/lib/postgresql/data

  tiler-importer:
    container_name: ${DOCKER_NAME_PREFIX:-osmdev}-tiler-importer
    image: ${DOCKER_NAME_PREFIX:-osmdev}-osmrep
    build:
      context: .
      dockerfile: docker/osmrep.Dockerfile
    command: /docker/tiler-importer.sh
    environment:
      OSMREP_TARGET: postgres://postgres:openstreetmap@tiler-db:5432/gpstiles
      OSMREP_FEED_URL: ${TILER_FEED_URL:-http://replication/gpx/}
      TILER_DUMP_URL: ${TILER_DUMP_URL:-http://replication/gps/gpx-planet-latest.osm.bz2}
      TILER_INTERVAL: ${TILER_INTERVAL:-60}
      OSMREP_CONFIG: /nonexistent
    volumes:
      - ${OSMREP_REPO:-../osmrep}:/osmrep
      - osmrep-bundle:/usr/local/bundle
      - ./docker:/docker:ro
    depends_on:
      - tiler-db
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  tiler-martin:
    container_name: ${DOCKER_NAME_PREFIX:-osmdev}-tiler-martin
    image: ghcr.io/maplibre/martin:1.16.1
    command: ["--webui", "enable-for-all", "--config", "/etc/martin.yaml"]
    volumes:
      - ./config/martin.yaml:/etc/martin.yaml:ro
    ports:
      - "127.0.0.1:${TILER_MARTIN_PORT:-3100}:3000"
    depends_on:
      - tiler-db

volumes:
  tiler-db-data:
  osmrep-bundle:
