# Martin for the consumer database. One source, trace_segments on its 2D
# column geom2d: ST_AsMVTGeom cannot clip the ZM geometry, and the postgis
# image also ships the tiger tables, so nothing is auto published.
postgres:
  connection_string: postgres://postgres:openstreetmap@tiler-db:5432/gpstiles
  auto_publish: false
  tables:
    trace_segments:
      schema: public
      table: trace_segments
      srid: 4326
      geometry_column: geom2d
      geometry_type: GEOMETRY
      properties:
        gpx_id: int8
        trackid: int4
