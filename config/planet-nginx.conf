# Serves the GPS dumps with directory listing, like planet.osm.org.
# / is a fixed page with the entry point, the rest is the /data volume.
server {
    listen 80;
    listen [::]:80;
    root /data;
    autoindex on;
    default_type text/plain;
    types {
        text/plain txt md5;
        application/gzip gz;
        application/x-bzip2 bz2;
    }

    location = / {
        default_type text/html;
        return 200 '<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>GPS traces data</title></head>
<body>
<h1>GPS traces data</h1>
<ul>
<li><a href="/gps/">/gps/</a> full dumps, <a href="/gps/gpx-latest.gpx.bz2">gpx-latest.gpx.bz2</a> (<a href="/gps/gpx-latest.gpx.bz2.md5">md5</a>)</li>
</ul>
</body>
</html>
';
    }
}
