# Serves the replication files with directory listing, like planet.osm.org/replication/.
# / is a fixed page with the two entry points, the rest is the /data volume.
server {
    listen 80;
    listen [::]:80;
    root /data;
    autoindex on;
    default_type text/plain;
    types {
        text/plain txt md5;
        application/gzip gz;
    }

    location = / {
        default_type text/html;
        return 200 '<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>GPS traces data</title></head>
<body>
<h1>GPS traces data</h1>
<ul>
<li><a href="/gps/">/gps/</a> full dumps, <a href="/gps/gpx-planet-latest.osm.gz">gpx-planet-latest.osm.gz</a> (<a href="/gps/gpx-planet-latest.osm.gz.md5">md5</a>)</li>
<li><a href="/gpx/">/gpx/</a> minutely replication, <a href="/gpx/state.txt">state.txt</a></li>
</ul>
</body>
</html>
';
    }
}
