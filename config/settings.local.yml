# Mounted over config/settings.local.yml of the app. Values come from .env and the compose files.
server_protocol: "<%= ENV.fetch('SERVER_PROTOCOL', 'http') %>"
server_url: "<%= ENV.fetch('SERVER_URL', 'localhost:3000') %>"
status: "online"
oauth_application: "<%= ENV['OAUTH_CLIENT_ID'] %>"
oauth_key: "<%= ENV['OAUTH_KEY'] %>"
id_application: "<%= ENV['OPENSTREETMAP_id_key'] %>"
memcache_servers: "memcached:11211"
avatar_storage: "<%= ENV.fetch('RAILS_STORAGE_SERVICE', 'local') %>"
trace_file_storage: "<%= ENV.fetch('RAILS_STORAGE_SERVICE', 'local') %>"
trace_image_storage: "<%= ENV.fetch('RAILS_STORAGE_SERVICE', 'local') %>"
trace_icon_storage: "<%= ENV.fetch('RAILS_STORAGE_SERVICE', 'local') %>"
nominatim_url: "https://nominatim.openstreetmap.org/"
overpass_url: "https://overpass-api.de/api/interpreter"
