# Local development on your own machine.
# No Traefik, no Let's Encrypt: the app is published straight on port 3000
# and it builds from ../openstreetmap-website (your working tree).
#
#   docker compose -f docker-compose.yaml -f docker-compose.local.yaml up
services:
  web:
    ports:
      - "3000:3000"
    # volumes:
    #   # Overrides the S3 settings with disk storage.
    #   - ./config/settings.local.dev.yml:/app/config/settings.local.yml

  db:
    platform: linux/amd64
    ports:
      - "54321:5432"
