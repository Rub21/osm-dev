# One source, trace_segments on its 2D column geom2d: ST_AsMVTGeom cannot
# clip the ZM geometry. Nothing else is published.
postgres:
  connection_string: postgres://postgres:openstreetmap@db:5432/gpstiles
  auto_publish: false
  tables:
    trace_segments:
      schema: public
      table: trace_segments
      srid: 4326
      geometry_column: geom2d
      geometry_type: GEOMETRY
      properties:
        gpx_id: int8
        trackid: int4
  # trace_dirs(z, x, y) from config/trace_dirs.sql: segments with their
  # direction (dir 0-31), to style like the gps-tile PNGs.
  functions:
    trace_dirs:
      schema: public
      function: trace_dirs
      minzoom: 0
      maxzoom: 22
