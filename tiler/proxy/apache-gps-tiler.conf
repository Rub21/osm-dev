# gps-tiler-*.rub21.com: vector tiles prototype (Martin) behind the tiler Traefik on :8080.
# Not managed by Chef. Cloudflare in front adds the public TLS.
<VirtualHost *:443>
  ServerName gps-tiler.rub21.com
  ServerAlias gps-tiler-*.rub21.com
  SSLEngine on
  SSLCertificateFile /etc/ssl/certs/gps-tile.openstreetmap.org.pem
  SSLCertificateKeyFile /etc/ssl/private/gps-tile.openstreetmap.org.key
  ProxyPreserveHost On
  RequestHeader set X-Forwarded-Proto "https"
  ProxyPass / http://127.0.0.1:8080/
  ProxyPassReverse / http://127.0.0.1:8080/
  CustomLog /var/log/apache2/gps-tiler-access.log combined
  ErrorLog /var/log/apache2/gps-tiler-error.log
</VirtualHost>
<VirtualHost *:80>
  ServerName gps-tiler.rub21.com
  ServerAlias gps-tiler-*.rub21.com
  ProxyPreserveHost On
  RequestHeader set X-Forwarded-Proto "https"
  ProxyPass / http://127.0.0.1:8080/
  ProxyPassReverse / http://127.0.0.1:8080/
  CustomLog /var/log/apache2/gps-tiler-access.log combined
  ErrorLog /var/log/apache2/gps-tiler-error.log
</VirtualHost>
