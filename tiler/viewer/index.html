<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPS tiles compare</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; background: #000; color: #eee; }
  .map { position: absolute; inset: 0; }
  #right { clip-path: inset(0 0 0 50%); }
  .label { position: absolute; top: 8px; z-index: 4; background: #000a; padding: 4px 8px; border-radius: 4px; pointer-events: none; }
  #label-left { left: 8px; }
  #label-right { right: 8px; }
  #divider { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: #fff; z-index: 5; cursor: ew-resize; }
  #divider::after { content: "\2194"; position: absolute; top: 50%; left: -15px; width: 32px; height: 32px; margin-top: -16px;
    border-radius: 50%; background: #fff; color: #000; font-size: 18px; line-height: 32px; text-align: center; }
  #legend { position: absolute; right: 8px; bottom: 28px; z-index: 3; background: #000c; padding: 8px; border-radius: 6px; text-align: center; }
  #legend div { margin-top: 4px; }
</style>
</head>
<body>
<div id="left" class="map"></div>
<div id="right" class="map"></div>
<div id="divider"></div>
<div id="label-left" class="label">PNG · gps-tile</div>
<div id="label-right" class="label">Vector · Martin</div>

<div id="legend">
  <canvas id="wheel" width="90" height="90"></canvas>
  <div>Color = direction of travel</div>
</div>

<script>
const PNG_TILES = "https://gps-tile.rub21.com/lines/{z}/{x}/{y}.png";
const VECTOR_TILEJSON = "https://gps-tiler-vt.rub21.com/trace_dirs";

// Same colors as the gps-tile PNGs (datamaps graphics.c, "sinebow"). The
// angle a of travel (0 = east, counterclockwise, as a turn 0-1) gives
// r, g, b = sin^2(pi * (-(a + 0.5) + k)) for k = 0, 1/3, 2/3.
function color(a) {
  const h = -(a + 0.5);
  const c = (k) => Math.round(255 * Math.sin(Math.PI * (h + k)) ** 2);
  return `rgb(${c(0)}, ${c(1 / 3)}, ${c(2 / 3)})`;
}

// dir is 0-31 from trace_dirs: 0 = east, 8 = north, 16 = west, 24 = south.
const lineColor = ["match", ["get", "dir"]];
for (let d = 0; d < 32; d++) lineColor.push(d, color((d + 0.5) / 32));
lineColor.push("#808080");

function style(sources, layers) {
  return {
    version: 8,
    sources,
    layers: [{ id: "background", type: "background", paint: { "background-color": "#000" } }, ...layers],
  };
}

const view = { center: [0, 20], zoom: 2 };

const left = new maplibregl.Map({
  container: "left", ...view,
  style: style(
    { gps: { type: "raster", tiles: [PNG_TILES], tileSize: 256, maxzoom: 18 } },
    [{ id: "gps", type: "raster", source: "gps" }],
  ),
});

const right = new maplibregl.Map({
  container: "right", ...view,
  style: style(
    { traces: { type: "vector", url: VECTOR_TILEJSON } },
    [{
      id: "traces", type: "line", source: "traces", "source-layer": "trace_dirs",
      layout: { "line-cap": "round", "line-join": "round" },
      paint: {
        "line-color": lineColor,
        // fade 1-10 dims long segments (GPS jumps) like datamaps -g.
        "line-opacity": ["*", 0.07, ["get", "fade"]],
        "line-width": ["interpolate", ["linear"], ["zoom"], 2, 0.5, 12, 1, 18, 2],
      },
    }],
  ),
});

// Keep both maps on the same view.
let syncing = false;
function sync(from, to) {
  from.on("move", () => {
    if (syncing) return;
    syncing = true;
    to.jumpTo({ center: from.getCenter(), zoom: from.getZoom(), bearing: from.getBearing(), pitch: from.getPitch() });
    syncing = false;
  });
}
sync(left, right);
sync(right, left);

// Swipe: drag the divider; the vector map shows right of it.
const divider = document.getElementById("divider");
const rightEl = document.getElementById("right");
function setSplit(px) {
  const pct = Math.min(100, Math.max(0, (px / window.innerWidth) * 100));
  divider.style.left = pct + "%";
  rightEl.style.clipPath = `inset(0 0 0 ${pct}%)`;
}
divider.addEventListener("pointerdown", (e) => {
  divider.setPointerCapture(e.pointerId);
  const move = (ev) => setSplit(ev.clientX);
  divider.addEventListener("pointermove", move);
  divider.addEventListener("pointerup", () => divider.removeEventListener("pointermove", move), { once: true });
});

// Legend: a color wheel with N up, E right, like a map.
const ctx = document.getElementById("wheel").getContext("2d");
const R = 30, C = 45;
for (let i = 0; i < 360; i++) {
  const a = i / 360;
  ctx.strokeStyle = color(a);
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(C, C);
  ctx.lineTo(C + R * Math.cos(2 * Math.PI * a), C - R * Math.sin(2 * Math.PI * a));
  ctx.stroke();
}
ctx.fillStyle = "#eee";
ctx.font = "11px system-ui";
ctx.textAlign = "center";
ctx.textBaseline = "middle";
ctx.fillText("N", C, C - R - 8);
ctx.fillText("S", C, C + R + 8);
ctx.fillText("E", C + R + 8, C);
ctx.fillText("W", C - R - 8, C);
</script>
</body>
</html>
